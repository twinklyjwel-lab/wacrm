name: Verma Jewellers Debug APK

on:
  push:
    branches:
      - claude/gold-silver-rates-app-rsx6vn
    paths:
      - "verma-jewellers-android/**"
      - ".github/workflows/verma-jewellers-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verma-jewellers-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: verma-jewellers-debug-apk
          path: verma-jewellers-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "verma-apk-run-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Verma Jewellers debug APK (run ${{ github.run_number }})" \
            --notes "Automated debug build from commit ${{ github.sha }}. Sideload only — not signed for release/Play Store." \
            --prerelease
