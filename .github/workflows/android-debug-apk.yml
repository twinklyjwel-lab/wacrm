name: Android Debug APK

on:
  push:
    branches:
      - claude/gold-silver-rates-app-rsx6vn
    paths:
      - "gold-silver-rates-android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold-silver-rates-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gold-silver-rates-debug-apk
          path: gold-silver-rates-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
